[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cineharbor"
version = "1.2.12"
description = "Local-first video production workspace connecting shot planning, user-owned cloud resources and third-party model workflows. Formerly GC Labs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "CineHarbor Contributors" }
]
keywords = ["comfyui", "google-colab", "ai-video", "storyboard", "local-first", "filmmaking"]
dependencies = [
  "google-colab-cli>=0.7.0",
  "aiohttp>=3.9.0",
]

[project.scripts]
cineharbor = "gclabs_cli:main"
gclabs = "gclabs_cli:main"

[tool.setuptools]
py-modules = [
  "server",
  "console",
  "gclabs_cli",
  "account_login",
  "comfy_local_bridge",
  "mobile_monitor",
  "model_presets",
  "timeline_export",
  "workflow_converter",
  "workflow_library",
  "workspace_backup",
]
